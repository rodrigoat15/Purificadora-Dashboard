<style>
/* Estilo basado en DESIGN.md (shadcn/ui): acromático, Geist, tarjetas de 24px con borde fino, controles en píldora de 18px.
   Excepción deliberada: verde/rojo solo para utilidad y pérdida (dato financiero), nunca como decoración. */
:root{
  --paper:#f5f5f5; --panel:#ffffff; --band:#fafafa; --ink:#0a0a0a; --ink-soft:#171717; --muted:#737373; --line:#e5e5e5;
  --in:#171717; --in-soft:#a3a3a3; --out:#8f8f8f; --out-soft:#d4d4d4;
  --pos:#15803d; --neg:#e7000b;
  --shadow:0 0 0 1px rgba(23,23,23,.05), 0 1px 3px rgba(0,0,0,.1), 0 1px 2px -1px rgba(0,0,0,.1);
  --font:"Geist", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0a0a0a; --panel:#171717; --band:#121212; --ink:#fafafa; --ink-soft:#e5e5e5; --muted:#a3a3a3; --line:#262626;
    --in:#fafafa; --in-soft:#737373; --out:#737373; --out-soft:#404040; --pos:#4ade80; --neg:#ff6467;
    --shadow:0 0 0 1px rgba(255,255,255,.04); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0a0a0a; --panel:#171717; --band:#121212; --ink:#fafafa; --ink-soft:#e5e5e5; --muted:#a3a3a3; --line:#262626;
  --in:#fafafa; --in-soft:#737373; --out:#737373; --out-soft:#404040; --pos:#4ade80; --neg:#ff6467;
  --shadow:0 0 0 1px rgba(255,255,255,.04); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.43;
  font-variant-numeric:tabular-nums;font-feature-settings:"ss01" on,"cv11" on;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:24px 24px 48px}

header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{font-weight:600;font-size:16px;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:13px;letter-spacing:0}
nav{display:flex;gap:4px;font-size:14px}
nav a{color:var(--muted);text-decoration:none;font-weight:500;padding:6px 12px;border-radius:18px}
nav a:hover{color:var(--ink);background:var(--panel)}
.status{font-size:12px;font-weight:500;color:var(--ink-soft);display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:4px 10px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--pos)} .dot.snap{background:var(--muted)}

.sec-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;padding:40px 0 0}
.sec-head .per{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sec-head .per b{color:var(--ink);font-weight:600}
label.sel{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
select{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px 34px 8px 14px;appearance:none;cursor:pointer;box-shadow:var(--shadow);
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
select:focus-visible,a:focus-visible,[tabindex]:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.hero{padding:12px 0 32px}
.hero h1,.hero h2.big{margin:0;font-weight:600;font-size:clamp(30px,4.4vw,48px);line-height:1.1;letter-spacing:-.05em;max-width:22ch}
.amt{font-weight:600} .amt.pos{color:var(--pos)} .amt.neg{color:var(--neg)}
.hero p{margin:16px 0 0;color:var(--muted);font-size:16px;line-height:1.5;max-width:64ch}

.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
@media (max-width:820px){.grid,.grid2{grid-template-columns:minmax(0,1fr)}}
section.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:24px;margin-top:20px;box-shadow:var(--shadow)}
.grid>section.panel{margin-top:0}
section.panel h2{margin:0 0 4px;font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.4}
.lead{margin:0 0 16px;color:var(--muted);font-size:14px}

.tscroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-weight:500;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;text-align:right;padding:8px;border-bottom:1px solid var(--line)}
table.t th:first-child{text-align:left}
table.t td{padding:8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
table.t tr:last-child td{border-bottom:0}
table.t td:first-child{text-align:left;white-space:normal}
table.er{min-width:520px}
table.er td{border-bottom:0}
table.er tr.sec td{padding-top:18px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
table.er tr.sub td:first-child{padding-left:20px;color:var(--muted)}
table.er tr.tot td{font-weight:600;border-top:1px solid var(--line)}
table.er tr.net td{font-weight:600;font-size:16px;border-top:1px solid var(--ink);padding-top:12px;letter-spacing:-.01em}
table.er tr.mg td{color:var(--muted);font-size:13px}
table.t tr.rest td{color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}
.note{margin:16px 0 0;padding:12px 14px;border:1px solid var(--line);background:var(--band);font-size:13px;border-radius:10px;color:var(--ink-soft)}
.note strong{color:var(--ink);font-weight:600}

.mix{display:flex;flex-direction:column;gap:24px}
.mix h3{margin:0 0 10px;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.bar{display:flex;gap:2px;height:10px;border-radius:18px;overflow:hidden;background:var(--line)}
.bar span{display:block;height:100%}
.legend{list-style:none;margin:12px 0 0;padding:0;font-size:14px}
.legend li{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.legend i,.keys i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:-1px}

.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:14px}
.hb .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .trk{height:8px;background:var(--paper);border-radius:18px;overflow:hidden}
.hb .trk span{display:block;height:100%;border-radius:18px}
.hb .val{color:var(--muted);font-size:13px;min-width:3.5em;text-align:right}

.chart-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.keys{display:flex;gap:16px;font-size:13px;color:var(--muted)}
svg.chart{width:100%;height:auto;display:block;margin-top:12px}
svg.chart .m{cursor:pointer}
svg.chart text{fill:var(--muted);font-family:var(--font);font-size:12px}
svg.chart text.on{fill:var(--ink);font-weight:600}

.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kv div{background:var(--band);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kv span{display:block;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kv b{display:block;font-size:24px;font-weight:600;letter-spacing:-.025em;line-height:1.33;margin-top:4px}
.kv small{color:var(--muted);font-size:13px}
.empty{color:var(--muted);font-size:14px;margin:0}

.tabs{display:inline-flex;gap:4px;margin-top:20px;padding:4px;background:var(--line);border-radius:18px}
.tabs button{font:inherit;font-weight:500;font-size:14px;color:var(--muted);background:none;border:0;border-radius:14px;padding:6px 16px;cursor:pointer}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--panel);box-shadow:var(--shadow)}
.cov td:not(:first-child),.cov th{text-align:left;white-space:normal}
.ok{color:var(--pos);font-weight:600} .part{color:var(--ink);font-weight:600;background:var(--paper);border-radius:18px;padding:1px 8px}
ul.an{margin:16px 0 0;padding-left:20px;font-size:14px;color:var(--ink-soft)} ul.an li{margin:6px 0}

.band{margin-top:48px;background:var(--band);border:1px solid var(--line);border-radius:24px;padding:4px 24px 24px}
.band .sec-head{padding-top:24px}
.band section.panel{margin-top:16px}
footer{margin-top:32px;font-size:12px;color:var(--muted)}
@media (max-width:560px){ .wrap{padding:16px 16px 40px} section.panel{padding:18px;border-radius:20px} .band{padding:4px 14px 18px} }
@media (prefers-reduced-motion:no-preference){ .hero h1{animation:rise .5s ease-out both} @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}} }
</style>
</head>

const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

function norm(d){
  d = JSON.parse(JSON.stringify(d));
  const ing=d.ingresos||{}, gas=d.gastos||{};
  const anio = d.anio || 2026, hoy = new Date();
  const mesHoy = hoy.getFullYear()===anio ? hoy.getMonth() : hoy.getFullYear()>anio ? 12 : -1;
  const parts = (o,i) => sum(Object.entries(o).filter(([k])=>k!=="TOTAL").map(([,v])=>v[i]));
  const cerradoEdr = MESES.map((_,i)=>((ing.TOTAL||[])[i]||parts(ing,i)||0)!==0 || ((gas.TOTAL||[])[i]||parts(gas,i)||0)!==0);
  // Mes ya terminado que aún no se cierra en EDO RESULTADOS: se arma con las pestañas mensuales (preliminar)
  const pg = (d.detalle||{}).pagos || {ingresos:{}, gastos:{}};
  const prelim = MESES.map((_,i)=>!cerradoEdr[i] && i<mesHoy &&
    (sum(Object.values(pg.ingresos).map(a=>a[i]))!==0 || sum(Object.values(pg.gastos).map(a=>a[i]))!==0));
  const sa = s => String(s).normalize("NFD").replace(/\p{M}/gu,"").toUpperCase();   // "CRÉDITO" = "CREDITO"
  const llave = (o,p) => Object.keys(o).find(k=>k!=="TOTAL" && (sa(k)===sa(p) || sa(k).startsWith(sa(p)) || sa(p).startsWith(sa(k)))) || p;
  [[ing,pg.ingresos],[gas,pg.gastos]].forEach(([o,src])=>prelim.forEach((on,i)=>{ if(!on) return;
    Object.entries(src).forEach(([p,a])=>{ if(!a[i]) return; const k=llave(o,p);
      o[k]=o[k]||MESES.map(()=>0); o[k][i]=(o[k][i]||0)+a[i]; });
    if(o.TOTAL) o.TOTAL[i]=parts(o,i); }));
  const tI = ing.TOTAL || MESES.map((_,i)=>parts(ing,i));
  const tG = gas.TOTAL || MESES.map((_,i)=>parts(gas,i));
  const util = MESES.map((_,i)=>(tI[i]||0)-(tG[i]||0));
  const cerrado = MESES.map((_,i)=>cerradoEdr[i] || prelim[i]);
  const chk = {};
  ["ingresos","gastos"].forEach(sec=>{ const o=d[sec]||{}, t=sec==="ingresos"?tI:tG;
    chk[sec] = MESES.map((_,i)=>{ const p=parts(o,i); return Math.abs(p-(t[i]||0))>1 ? {parts:p,total:t[i]} : null; }); });
  const ultimo = cerrado.lastIndexOf(true);
  const diario = (d.diario||[]).slice().sort((a,b)=>a.fecha.localeCompare(b.fecha));
  // Mes actual: el mes del calendario (el 1 de octubre pasa solo a octubre y septiembre queda en el histórico).
  // Fuera del año del Sheet: el más reciente entre (último cerrado + 1) y la última nota cargada.
  const ultNota = diario.length ? diario[diario.length-1].fecha : null;
  let actual = Math.min(11, ultimo+1);
  if (ultNota && Number(ultNota.slice(0,4))===anio) actual = Math.max(actual, Number(ultNota.slice(5,7))-1);
  if (mesHoy>=0 && mesHoy<=11) actual = mesHoy;
  return {...d, anio, diario, tI, tG, util, cerrado, prelim, chk, ultimo, actual, inventario: d.inventario || null,
    ingK:Object.keys(ing).filter(k=>k!=="TOTAL"), gasK:Object.keys(gas).filter(k=>k!=="TOTAL"),
    detalle: d.detalle || {gastos:{},clientes:{}}, gastos_notas: d.gastos_notas || {}};
}

function meses(){ return SEL==="ytd" ? MESES.map((_,k)=>k).filter(k=>DATA.cerrado[k]) : [Number(SEL)]; }

  s.value = [...s.options].some(o=>o.value===prev) ? prev : "ytd";

  DATA.ingK.forEach(k=> t += row(nice(k), DATA.ingresos[k], "sub"));

  t += `<tr class="sec"><td colspan="${cols.length+1}">Gastos</td></tr>`;
  DATA.gasK.forEach(k=> t += row(nice(k), DATA.gastos[k], "sub", false, true));
  t += row("Total gastos", DATA.tG, "tot", false, true);
  t += row("Utilidad o pérdida", DATA.util, "net", true);
  t += `<tr class="mg"><td>Margen sobre ingresos</td>${cols.map(([,f,isVar])=>isVar?"<td></td>":`<td>${pct(f(DATA.util)/f(DATA.tI))}</td>`).join("")}</tr></tbody>`;
  $("er").innerHTML = t;

  const warns=[];
  const pre = ms.filter(k=>DATA.prelim[k]);
  if (pre.length) warns.push(`<strong>${pre.map(k=>cap(MESES[k])).join(", ")}: preliminar.</strong> Todavía no se cierra en EDO RESULTADOS; las cifras salen de las pestañas INGRESOS y GASTOS del mes (efectivo de la libreta más lo capturado a mano). Revisa que estén todas las transferencias y pagos con tarjeta; al cerrarlo en EDO RESULTADOS se usan esas cifras.`);
  ["ingresos","gastos"].forEach(sec=>ms.forEach(k=>{ const w=DATA.chk[sec][k]; if(w)
    warns.push(`<strong>Revisar en el Sheet.</strong> ${cap(MESES[k])}: las formas de pago de ${sec} suman ${money(w.parts)}, pero el total dice ${money(w.total)} (diferencia de ${money(w.total-w.parts)}); el tablero usa el total del Sheet.`); }));
  $("warn").innerHTML = warns.join(" "); $("warn").hidden = !warns.length;

  // Formas de pago
  const mix = (title, keys, obj, colors, total) => {
    const parts = keys.map((k,j)=>({k, v:pickM(obj[k],ms), c:colors[j%colors.length]})).filter(p=>p.v>0);
    return `<div><h3>${title}</h3><div class="bar">${parts.map(p=>`<span style="width:${p.v/total*100}%;background:${p.c}"></span>`).join("")}</div>
      <ul class="legend">${parts.map(p=>`<li><span><i style="background:${p.c}"></i>${nice(p.k)}</span><span>${money(p.v)} · ${pct(p.v/total)}</span></li>`).join("")}</ul></div>`;
  };
  $("mix").innerHTML = `<h2>Cómo entra y sale el dinero</h2>` +
    mix("Ingresos por forma de cobro", DATA.ingK, DATA.ingresos, ["var(--in)","var(--in-soft)","var(--muted)"], I) +
    mix("Gastos por forma de pago", DATA.gasK, DATA.gastos, ["var(--out)","var(--out-soft)","var(--in)"], G);

  drawChart(ytd ? -1 : i);
  renderGastos(ms, ytd);
  renderClientes(ms, ytd);
  renderCaja(ms);
}

function hbars(items, total, color, fmtVal){
  const max = Math.max(...items.map(x=>x.v),1);
  return `<div class="hbars">${items.map(x=>`<div class="hb"><span class="lbl" title="${esc(x.k)}">${esc(x.k)}</span>
    <span class="trk"><span style="width:${x.v/max*100}%;background:${color}"></span></span><span class="val">${fmtVal(x)}</span></div>`).join("")}</div>`;
}

function renderGastos(ms, ytd){
  const g = DATA.detalle.gastos;
  const conceptos = Object.keys(g).map(k=>({k, v:pickM(g[k],ms), cat:categoria(k)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const total = sum(conceptos.map(x=>x.v));
  if(!total){ $("gastos").innerHTML = `<h2>En qué se gasta</h2><p class="empty">No hay detalle de gastos en las pestañas mensuales para este periodo.</p>`; return; }
  const cats = {}; conceptos.forEach(x=>cats[x.cat]=(cats[x.cat]||0)+x.v);
  const catItems = Object.entries(cats).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  const top = catItems[0];
  const edr = pickM(DATA.tG, ms);
  const porMes = ms.map(k=>({k, d:sum(Object.values(g).map(a=>a[k]||0))-(DATA.tG[k]||0)})).filter(x=>Math.abs(x.d)>1);
  const dif = Math.abs(edr-total)>1 ? `<p class="note">El detalle de las pestañas de gastos suma ${money(total)} y el estado de resultados ${money(edr)}. ` +
    `${porMes.length?`La diferencia está en ${porMes.map(x=>`${MESES[x.k]} (la pestaña GASTOS tiene ${money(Math.abs(x.d))} ${x.d>0?"más":"menos"} que EDO RESULTADOS)`).join(", ")}.`:""} Los porcentajes de esta sección usan el detalle de las pestañas.</p>` : "";
  $("gastos").innerHTML = `<h2>En qué se gasta</h2>
    <p class="lead">${esc(top.k)} se lleva ${pct(top.v/total)} del gasto ${ytd?`de enero a ${MESES[DATA.ultimo]}`:`de ${MESES[ms[0]]}`}. Porcentajes sobre ${money(total)}.</p>
    <div class="grid2">
      <div>${hbars(catItems, total, "var(--out)", x=>pct(x.v/total))}</div>
      <div class="tscroll"><table class="t"><thead><tr><th>Concepto</th><th>Monto</th><th>%</th></tr></thead><tbody>
        ${conceptos.map(x=>`<tr><td>${nice(x.k)}<br><small class="mut">${x.cat}</small></td><td>${money(x.v)}</td><td>${pct(x.v/total)}</td></tr>`).join("")}
      </tbody></table></div>
    </div>${dif}`;
}

function renderClientes(ms, ytd){
  const c = DATA.detalle.clientes;
  const all = Object.keys(c).map(k=>({k, gf:pickM(c[k].gf,ms), v:pickM(c[k].imp,ms)})).filter(x=>x.v>0||x.gf>0);
  const GF = sum(all.map(x=>x.gf)), IMP = sum(all.map(x=>x.v));
  if(!IMP){ $("clientes").innerHTML = `<h2>Mayores clientes</h2><p class="empty">No hay ventas por cliente en las pestañas mensuales para este periodo.</p>`; return; }
  const grp = k => /^VENTANILLA/.test(k) ? "VENTANILLA" : /^GARRAFON/.test(k) ? "GARRAFÓN NUEVO" : /^RUTA EFECTIVO/.test(k) ? "RUTA EFECTIVO (LIBRETA)" : k;
  const cmap = {}; all.filter(x=>CONFIG.CANALES.test(x.k)).forEach(x=>{ const g=grp(x.k); cmap[g]=cmap[g]||{k:g,gf:0,v:0}; cmap[g].gf+=x.gf; cmap[g].v+=x.v; });
  const canales = Object.values(cmap);
  const nombrados = all.filter(x=>!CONFIG.CANALES.test(x.k)).sort((a,b)=>b.gf-a.gf || b.v-a.v);
  const top = nombrados.slice(0, CONFIG.TOP_CLIENTES), resto = nombrados.slice(CONFIG.TOP_CLIENTES);
  const topGf = sum(top.map(x=>x.gf));
  const canalTxt = canales.sort((a,b)=>b.gf-a.gf).map(x=>`${nice(x.k)} ${pct(x.gf/GF)}`).join(", ");
  const fila = x => `<tr><td>${nice(x.k)}</td><td>${int(x.gf)}</td><td>${pct(x.gf/GF)}</td><td>${money(x.v)}</td><td>${pct(x.v/IMP)}</td></tr>`;
  $("clientes").innerHTML = `<h2>Mayores clientes</h2>
    <p class="lead">Los ${top.length} clientes más grandes consumieron ${int(topGf)} garrafones, ${pct(topGf/GF)} del total vendido ${ytd?`de enero a ${MESES[DATA.ultimo]}`:`en ${MESES[ms[0]]}`} (${int(GF)}).</p>
    <div class="grid2">
      <div>${hbars(top.map(x=>({k:nice(x.k),v:x.gf})), GF, "var(--in)", x=>`${int(x.v)} gf`)}</div>
      <div class="tscroll"><table class="t"><thead><tr><th>Cliente</th><th>Garrafones</th><th>% consumo</th><th>Ingreso</th><th>% ingreso</th></tr></thead><tbody>
        ${top.map(fila).join("")}
        ${resto.length?`<tr class="rest"><td>Otros ${resto.length} clientes</td><td>${int(sum(resto.map(x=>x.gf)))}</td><td>${pct(sum(resto.map(x=>x.gf))/GF)}</td><td>${money(sum(resto.map(x=>x.v)))}</td><td>${pct(sum(resto.map(x=>x.v))/IMP)}</td></tr>`:""}
        ${canales.map(x=>`<tr class="rest"><td>${nice(x.k)}</td><td>${int(x.gf)}</td><td>${pct(x.gf/GF)}</td><td>${money(x.v)}</td><td>${pct(x.v/IMP)}</td></tr>`).join("")}
      </tbody></table></div>
    </div>
    ${canalTxt?`<p class="lead" style="margin:14px 0 0">Además de los clientes con nombre: ${canalTxt} de los garrafones.</p>`:""}`;
}

function renderCaja(ms){
  const cj = DATA.caja || {};
  const items = Object.keys(cj).map(k=>({k, v:pickM(cj[k],ms)})).filter(x=>x.v!==0);
  $("caja").innerHTML = `<h2>Caja y movimientos de socios</h2>` + (items.length
    ? `<div class="kv" style="margin-top:12px">${items.map(x=>`<div><span>${nice(x.k)}</span><b class="${x.k.includes("SALDO")?cls(x.v):""}">${money(x.v)}</b></div>`).join("")}</div>`
    : `<p class="empty">No hay movimientos de caja ni de socios en este periodo.</p>`);
}

function drawChart(sel){
  const W=960,H=300,padL=56,padR=12,padT=16,padB=34, cw=(W-padL-padR)/12, bw=Math.min(18,cw*.28);
  const max=Math.max(...DATA.tI,...DATA.tG,1), minU=Math.min(0,...DATA.util);
  const top=Math.ceil(max/10000)*10000, bot=Math.floor(minU/10000)*10000;
  const y=v=>padT+(top-v)/(top-bot)*(H-padT-padB);
  const step=(top-bot)>60000?20000:10000;
  let g="";
  for(let v=bot;v<=top;v+=step){
    g+=`<line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?"var(--muted)":"var(--line)"}"/>`;
    g+=`<text x="${padL-8}" y="${y(v)+4}" text-anchor="end">${v===0?"0":(v/1000)+"k"}</text>`;
  }
  const pts=[];
  MESES.forEach((m,i)=>{
    const cx=padL+cw*i+cw/2, on=i===sel, act=DATA.cerrado[i], op=(sel<0||on?1:.45)*(DATA.prelim[i]?.55:1);
    let b="";
    if(act){
      b+=`<rect x="${cx-bw-1}" y="${y(DATA.tI[i])}" width="${bw}" height="${y(0)-y(DATA.tI[i])}" fill="var(--in)" opacity="${op}" rx="2"/>`;
      b+=`<rect x="${cx+1}" y="${y(DATA.tG[i])}" width="${bw}" height="${y(0)-y(DATA.tG[i])}" fill="var(--out)" opacity="${op}" rx="2"/>`;
      pts.push([cx,y(DATA.util[i]),DATA.util[i],on]);
    } else b+=`<rect x="${cx-bw-1}" y="${y(0)-3}" width="${bw*2+2}" height="3" fill="var(--line)"/>`;
    g+=`<g class="m" ${act?`tabindex="0" role="button" aria-label="Ver ${m}" data-i="${i}"`:""}>
      <rect x="${padL+cw*i+2}" y="${padT}" width="${cw-4}" height="${H-padT-padB+22}" fill="${on?"var(--in-soft)":"transparent"}" opacity="${on?.35:1}" rx="6"/>
      ${b}<text x="${cx}" y="${H-10}" text-anchor="middle" class="${on?"on":""}">${cap(m).slice(0,3)}${DATA.prelim[i]?"*":""}</text></g>`;
  });
  if(pts.length>1) g+=`<polyline points="${pts.map(p=>p[0]+","+p[1]).join(" ")}" fill="none" stroke="var(--pos)" stroke-width="2"/>`;
  pts.forEach(p=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${p[3]?6:4}" fill="${p[2]<0?"var(--neg)":"var(--pos)"}" stroke="var(--panel)" stroke-width="2"/>`);
  const svg=$("chart"); svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.innerHTML=g;
  svg.querySelectorAll(".m[data-i]").forEach(el=>{
    const go=()=>{ SEL=el.dataset.i; $("periodo").value=SEL; renderResultados(); };
    el.addEventListener("click",go);
    el.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } });
  });
}

function renderActual(){
  const m = DATA.actual, anio = DATA.anio, key = `${anio}-${String(m+1).padStart(2,"0")}`;
  const dm = DATA.diario.filter(x=>x.fecha.slice(0,7)===key);   // incluye días no laborados (solo para la tabla)
  const dd = dm.filter(x=>!x.no_laborado);
  const box = $("actual");
  const head = `<div class="sec-head"><div class="per">Mes actual · solo notas de la libreta</div></div>`;
  if(!dd.length){
    box.innerHTML = head + `<div class="hero"><h2 class="big">${cap(MESES[m])} ${anio}: aún sin notas cargadas.</h2>
      <p>Guarda las fotos en la carpeta y corre /procesar-fotos en Claude Code.</p></div>`; return;
  }
  const S=k=>sum(dd.map(x=>x[k]||0)), last=dd[dd.length-1];
  const fd=f=>{const [y,mo,d]=f.split("-").map(Number); return new Date(y,mo-1,d).toLocaleDateString("es-MX",{weekday:"short",day:"numeric"});};
  // días laborales transcurridos del mes
  const hoy=new Date(), fin=(hoy.getFullYear()===anio&&hoy.getMonth()===m)?hoy.getDate():new Date(anio,m+1,0).getDate();
  let lab=0; for(let d=1; d<=fin; d++) if(CONFIG.DIAS_LABORALES.includes(new Date(anio,m,d).getDay())) lab++;
  const gf = S("ventanilla_garrafones")+S("ruta_garrafones");
  const efectivo = S("ventanilla_importe")+S("ruta_efectivo");
  const gn = Object.entries(DATA.gastos_notas[key]||{}).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  const gT = sum(gn.map(x=>x.v)) || S("gastos");

  const W=960,H=150,pl=8,pb=24, gap=(W-pl*2)/Math.max(dd.length,6), bw=Math.min(34,gap*.6);
  const mx=Math.max(...dd.map(x=>x.ventanilla_garrafones+x.ruta_garrafones),1), hy=v=>v/mx*(H-pb-18);
  let g=""; dd.forEach((x,k)=>{ const cx=pl+gap*k+gap/2, hv=hy(x.ventanilla_garrafones), hr=hy(x.ruta_garrafones);
    g+=`<rect x="${cx-bw/2}" y="${H-pb-hr}" width="${bw}" height="${hr}" fill="var(--in)" rx="2"/>`;
    g+=`<rect x="${cx-bw/2}" y="${H-pb-hr-hv}" width="${bw}" height="${hv}" fill="var(--in-soft)" rx="2"/>`;
    g+=`<text x="${cx}" y="${H-pb-hr-hv-5}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${x.ventanilla_garrafones+x.ruta_garrafones}</text>`;
    g+=`<text x="${cx}" y="${H-6}" text-anchor="middle">${fd(x.fecha)}</text>`; });

  box.innerHTML = head + `
    <div class="hero"><h2 class="big">${cap(MESES[m])} lleva <span class="amt pos">${money(efectivo)}</span> en efectivo y <span class="amt">${money(gT)}</span> de gastos anotados.</h2>
      <p>${dd.length} ${dd.length===1?"nota cargada":"notas cargadas"} de ${lab} días laborales transcurridos. Las transferencias y pagos con tarjeta se suman al cierre del mes, cuando ${MESES[m]} pasa a Resultados.</p></div>
    <section class="panel">
      <div class="kv">
        <div><span>Ventanilla</span><b>${money(S("ventanilla_importe"))}</b><small>${int(S("ventanilla_garrafones"))} garrafones</small></div>
        <div><span>Ruta en efectivo</span><b>${money(S("ruta_efectivo"))}</b><small>${int(S("ruta_garrafones"))} garrafones entregados</small></div>
        <div><span>Gastos anotados</span><b>${money(gT)}</b><small>pagados de caja</small></div>
        <div><span>Caja al cierre</span><b>${money(last.caja_total-(last.corte||0))}</b><small>${fd(last.fecha)}${last.corte?` · después del corte`:""}</small></div>
        <div><span>Cortes de caja</span><b>${money(S("corte"))}</b><small>retirado por el dueño</small></div>
      </div>
    </section>
    <section class="panel">
      <div class="chart-head"><h2 style="margin:0">Garrafones por día</h2>
        <div class="keys"><span><i style="background:var(--in)"></i>Ruta</span><span><i style="background:var(--in-soft)"></i>Ventanilla</span></div></div>
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Garrafones por día">${g}</svg>
    </section>
    <div class="grid2">
      <section class="panel"><h2>Gastos anotados</h2><p class="lead">En qué se fue el efectivo de caja este mes.</p>
        ${gn.length ? hbars(gn.map(x=>({k:nice(x.k),v:x.v})), gT, "var(--out)", x=>`${money(x.v)} · ${pct(x.v/gT)}`) : `<p class="empty">Sin gastos anotados.</p>`}
      </section>
      <section class="panel"><h2>Día por día</h2><p class="lead">Del más reciente al más antiguo.</p>
        <div class="tscroll"><table class="t"><thead><tr><th>Día</th><th>Ventanilla</th><th>Ruta</th><th>Gastos</th><th>Caja</th><th>Corte de caja</th><th>Cuadre</th></tr></thead><tbody>
        ${dm.slice().reverse().map(x=> x.no_laborado
          ? `<tr><td>${fd(x.fecha)}</td><td colspan="6" class="mut">${esc(x.nota||"No se trabajó")}</td></tr>`
          : `<tr><td>${fd(x.fecha)}</td><td>${money(x.ventanilla_importe)}<br><small class="mut">${x.ventanilla_garrafones} gf</small></td><td>${money(x.ruta_efectivo)}<br><small class="mut">${x.ruta_garrafones} gf</small></td><td>${money(x.gastos)}</td><td>${money(x.caja_total)}</td><td>${x.corte?money(x.corte):"—"}</td><td class="${x.cuadra?"pos":"neg"}" ${x.nota?`title="${esc(x.nota)}"`:""}>${x.cuadra?"Cuadra":"No cuadra"}${x.nota?`<br><small class="mut">${esc(x.nota)}</small>`:""}</td></tr>`).join("")}
        </tbody></table></div>
      </section>
    </div>`;
}

// Columnas (apiladas si hay varias capas) con tooltip por mes, bandas de "sin dato" y separadores de año.
function columnas(o){
  const n=o.labels.length, W=960, H=270, pl=8, pr=8, pt=26, pb=30, cw=(W-pl-pr)/n, bw=Math.min(30,cw*.62);
  const tot=i=>sum(o.capas.map(c=>c.v[i]||0)), max=Math.max(...o.labels.map((_,i)=>tot(i)),1)*1.08;
  const y=v=>pt+(1-v/max)*(H-pt-pb), x0=i=>pl+cw*i;
  let g="";
  (o.bandas||[]).forEach(b=>{ const x=x0(b.desde), w=cw*(b.hasta-b.desde+1);
    g+=`<rect x="${x}" y="${pt-18}" width="${w}" height="${H-pb-pt+18}" fill="var(--line)" opacity=".45" rx="6"/>`;
    g+=`<text x="${x+w/2}" y="${pt-4}" text-anchor="middle">${esc(b.texto)}</text>`; });
  (o.anios||[]).forEach(([i,a])=>{ if(i>0) g+=`<line x1="${x0(i)}" x2="${x0(i)}" y1="${pt-18}" y2="${H-pb+4}" stroke="var(--line)" stroke-dasharray="3 3"/>`;
    g+=`<text x="${x0(i)+4}" y="${H-pb+26}" style="fill:var(--ink);font-weight:700">${a}</text>`; });
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)"/>`;
  o.labels.forEach((lb,i)=>{
    // mes parcial/incompleto: barra punteada (sin relleno), para no confundirla con otra serie en la paleta de grises
    const cx=x0(i)+cw/2, dim=(o.atenuar||[]).includes(i); let acc=0, r="";
    o.capas.forEach(c=>{ const v=c.v[i]; if(!v) return; const y0=y(acc), y1=y(acc+v), h=Math.max(1,y0-y1-(acc?2:0));
      r+= dim ? `<rect x="${cx-bw/2+.75}" y="${y1+.75}" width="${bw-1.5}" height="${Math.max(1,h-1.5)}" fill="var(--panel)" stroke="${c.fill}" stroke-width="1.5" stroke-dasharray="3 2" rx="2"/>`
              : `<rect x="${cx-bw/2}" y="${y1}" width="${bw}" height="${h}" fill="${c.fill}" rx="2"/>`; acc+=v; });
    const lbl=(o.etiquetas||[]).includes(i) && tot(i) ? `<text x="${cx}" y="${y(tot(i))-5}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${o.fmt(tot(i))}</text>` : "";
    g+=`<g><title>${esc(o.tip(i))}</title><rect x="${x0(i)}" y="${pt-18}" width="${cw}" height="${H-pt}" fill="transparent"/>${r}${lbl}
        <text x="${cx}" y="${H-pb+13}" text-anchor="middle">${lb}</text></g>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H+12}" role="img" aria-label="${esc(o.aria)}">${g}</svg>`;
}

// 2026 en vivo desde MATRIZ CONCENTRADO (el Sheet del dashboard), con los mismos criterios que la pestaña 2026:
// mes cerrado en EDO RESULTADOS → pestañas mensuales (garrafones por cliente); mes sin cerrar con notas de libreta →
// DIARIO (ruta = todas las entregas, porque la ruta en efectivo de la libreta no lleva garrafones por cliente).
function serie2026(){
  if(!DATA) return [];
  const anio=DATA.anio, hoy=new Date(), ult = hoy.getFullYear()===anio ? hoy.getMonth() : hoy.getFullYear()>anio ? 11 : -1;
  const cli=DATA.detalle.clientes||{}, out=[];
  for(let k=0;k<=ult;k++){
    const key=`${anio}-${String(k+1).padStart(2,"0")}`, dd=DATA.diario.filter(x=>x.fecha.slice(0,7)===key && !x.no_laborado);
    let vent=0, ruta=0, fuente;
    const cerradoEdr = DATA.cerrado[k] && !DATA.prelim[k];
    if(dd.length && !cerradoEdr){ vent=sum(dd.map(x=>x.ventanilla_garrafones)); ruta=sum(dd.map(x=>x.ruta_garrafones)); fuente="libreta"; }
    else { Object.entries(cli).forEach(([c,v])=>{ const g=(v.gf||[])[k]||0; if(/^RUTA EFECTIVO/.test(c)) return;
             if(/^(VENTANILLA|GARRAFON)/.test(c)) vent+=g; else ruta+=g; }); fuente="pestañas"; }
    if(vent+ruta>0) out.push({y:anio, m:k, vent, ruta, fuente, enCurso:k===hoy.getMonth()&&hoy.getFullYear()===anio});
  }
  // mes con muy pocos garrafones (menos de la mitad de la mediana) = registro incompleto
  const tots=out.filter(x=>!x.enCurso).map(x=>x.vent+x.ruta).sort((a,b)=>a-b), med=tots.length?tots[Math.floor(tots.length/2)]:0;
  out.forEach(x=>x.incompleto = !x.enCurso && x.vent+x.ruta < med/2);
  // Ventanilla que viene del documento «Analisis de Purificadora» (notas del cuaderno no capturadas en MATRIZ)
  out.forEach(x=>{ const d=HIST.ventanilla2026Doc[x.m]; if(d!=null && x.y===2026){ x.vent=d; x.ventDoc=true; }
                   x.ventOk = !x.enCurso && (x.ventDoc || !x.incompleto); });
  return out;
}

renderHistorico();
if(location.hash==="#historico") showTab("hist");

/* ===== Carga ===== */
function setStatus(){
  const when=new Date(DATA.actualizado);
  $("status").innerHTML = `<span class="dot ${SOURCE}"></span><span>${SOURCE==="live"
    ? `En vivo · leído ${when.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})}`
    : `Datos de respaldo del ${when.toLocaleDateString("es-MX",{day:"numeric",month:"long"})}`}</span>`;
  $("foot").textContent = SOURCE==="live"
    ? `Fuente: Google Sheets. Resultados: EDO RESULTADOS y pestañas mensuales. Mes actual: pestañas DIARIO y MOVIMIENTOS. Se actualiza cada ${CONFIG.REFRESH_MIN} minutos.`
    : (CONFIG.SOURCE_URL ? "No se pudo leer el Sheet; se muestran los datos de respaldo. Revisa la URL y la clave del Apps Script." : "Conecta el Sheet pegando la URL del Apps Script en CONFIG.SOURCE_URL.");
}

async function load(){
  let d=SNAPSHOT; SOURCE="snap";
  if(CONFIG.SOURCE_URL){
    try{ const r=await fetch(`${CONFIG.SOURCE_URL}?key=${encodeURIComponent(CONFIG.KEY)}&t=${Date.now()}`); const j=await r.json();
      if(j && !j.error && j.ingresos){ d=j; SOURCE="live"; } }catch(e){ console.warn("Sheet no disponible:",e); }
  }
  DATA=norm(d);
  if(DATA.empresa) $("brand").innerHTML = `${nice(DATA.empresa)}<small>Resultados del negocio ${DATA.anio}</small>`;
  buildSelect(); renderResultados(); renderInventario(); renderActual(); renderHistorico(); setStatus();
}
$("periodo").addEventListener("change",e=>{ SEL=e.target.value; renderResultados(); });
load();
if(CONFIG.SOURCE_URL) setInterval(load, CONFIG.REFRESH_MIN*60*1000);
</script>
</body>
</html>
