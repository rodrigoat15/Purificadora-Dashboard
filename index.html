<style>
/* Estilo basado en DESIGN (1).md (Seline Analytics): papel cálido, neutros "stone", un solo acento cian,
   títulos en peso 400 con tracking cerrado, tarjetas planas de 10px con borde fino, controles en píldora.
   Excepción deliberada: rojo solo para pérdida / variación negativa (dato financiero), nunca decorativo. */
:root{
  --paper:#fafaf9; --panel:#ffffff; --band:#f5f5f4; --ink:#0c0a09; --ink-soft:#1c1917; --muted:#78716c; --ash:#a8a29e;
  --line:#e8e6e5; --line-2:#d6d3d1;
  --accent:#3ba6f1; --accent-edge:#3398e1; --wash:#c1e1f7;
  --in:#3ba6f1; --in-soft:#a8a29e; --out:#78716c; --out-soft:#d6d3d1;
  --pos:#3398e1; --neg:#dc2626; --util:#0c0a09;
  --shadow:0 4px 16px rgba(0,0,0,.05); --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --font:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-d:"Inter Tight", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0c0a09; --panel:#1c1917; --band:#171412; --ink:#fafaf9; --ink-soft:#e7e5e4; --muted:#a8a29e; --ash:#78716c;
    --line:#292524; --line-2:#44403c; --wash:rgba(59,166,241,.18);
    --in:#3ba6f1; --in-soft:#57534e; --out:#a8a29e; --out-soft:#44403c; --pos:#7cc4f8; --neg:#f87171; --util:#fafaf9;
    --shadow:0 4px 16px rgba(0,0,0,.35); --shadow-sm:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0c0a09; --panel:#1c1917; --band:#171412; --ink:#fafaf9; --ink-soft:#e7e5e4; --muted:#a8a29e; --ash:#78716c;
  --line:#292524; --line-2:#44403c; --wash:rgba(59,166,241,.18);
  --in:#3ba6f1; --in-soft:#57534e; --out:#a8a29e; --out-soft:#44403c; --pos:#7cc4f8; --neg:#f87171; --util:#fafaf9;
  --shadow:0 4px 16px rgba(0,0,0,.35); --shadow-sm:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.64;letter-spacing:.004em;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:20px 24px 64px}

header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{font-weight:500;font-size:14px;color:var(--ink)}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:13px}
nav{display:flex;gap:0;font-size:14px}
nav a{color:var(--muted);text-decoration:none;padding:4px 12px;border-radius:9999px}
nav a:hover{color:var(--ink)}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:9999px;padding:3px 10px;box-shadow:var(--shadow-sm)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ash)}
.dot.live{background:var(--accent)} .dot.snap{background:var(--ash)}

.sec-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;padding:48px 0 0}
.sec-head .per{font-size:13px;color:var(--muted)}
.sec-head .per b{color:var(--ink);font-weight:500}
label.sel{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9999px;padding:6px 34px 6px 16px;appearance:none;cursor:pointer;box-shadow:var(--shadow-sm);
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
select:focus-visible,a:focus-visible,[tabindex]:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hero{padding:12px 0 36px}
.hero h1,.hero h2.big{margin:0;font-family:var(--font-d);font-weight:400;font-size:clamp(32px,4.6vw,52px);line-height:1.12;letter-spacing:-.021em;max-width:22ch}
.amt{font-weight:500}
.amt.pos{color:var(--accent-edge);background:var(--wash);border-radius:4px;padding:0 .18em;font-weight:400;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.amt.neg{color:var(--neg)}
.hero p{margin:16px 0 0;color:var(--muted);font-size:16px;line-height:1.69;max-width:64ch}

.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
@media (max-width:820px){.grid,.grid2{grid-template-columns:minmax(0,1fr)}}
section.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;margin-top:24px;box-shadow:var(--shadow)}
.grid>section.panel{margin-top:0}
section.panel h2{margin:0 0 4px;font-family:var(--font-d);font-size:20px;font-weight:400;letter-spacing:-.005em;line-height:1.2}
.lead{margin:0 0 16px;color:var(--muted);font-size:14px}

.tscroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.025em;text-align:right;padding:8px;border-bottom:1px solid var(--line)}
table.t th:first-child{text-align:left}
table.t td{padding:8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
table.t tr:last-child td{border-bottom:0}
table.t td:first-child{text-align:left;white-space:normal}
table.er{min-width:520px}
table.er td{border-bottom:0}
table.er tr.sec td{padding-top:18px;font-weight:500;font-size:12px;letter-spacing:.025em;color:var(--muted)}
table.er tr.sub td:first-child{padding-left:20px;color:var(--muted)}
table.er tr.tot td{font-weight:500;border-top:1px solid var(--line)}
table.er tr.net td{font-family:var(--font-d);font-weight:500;font-size:17px;border-top:1px solid var(--ink);padding-top:12px}
table.er tr.mg td{color:var(--muted);font-size:13px}
table.t tr.rest td{color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}
.note{margin:16px 0 0;padding:12px 14px;border:1px solid var(--line);background:var(--band);font-size:13px;border-radius:10px;color:var(--ink-soft)}
.note strong{color:var(--ink);font-weight:500}

.mix{display:flex;flex-direction:column;gap:24px}
.mix h3{margin:0 0 10px;font-size:13px;font-weight:500;color:var(--muted)}
.bar{display:flex;gap:2px;height:10px;border-radius:9999px;overflow:hidden;background:var(--line)}
.bar span{display:block;height:100%}
.legend{list-style:none;margin:12px 0 0;padding:0;font-size:14px}
.legend li{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.legend i,.keys i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:-1px}

.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:14px}
.hb .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .trk{height:8px;background:var(--band);border-radius:9999px;overflow:hidden}
.hb .trk span{display:block;height:100%;border-radius:9999px}
.hb .val{color:var(--muted);font-size:13px;min-width:3.5em;text-align:right}

.chart-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.keys{display:flex;gap:16px;font-size:13px;color:var(--muted)}
svg.chart{width:100%;height:auto;display:block;margin-top:12px}
svg.chart .m{cursor:pointer}
svg.chart text{fill:var(--muted);font-family:var(--font);font-size:12px}
svg.chart text.on{fill:var(--ink);font-weight:500}

.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kv div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kv span{display:block;font-size:12px;color:var(--muted)}
.kv b{display:block;font-family:var(--font-d);font-size:26px;font-weight:400;letter-spacing:-.025em;line-height:1.25;margin-top:2px}
.kv small{color:var(--muted);font-size:13px}
.empty{color:var(--muted);font-size:14px;margin:0}

.tabs{display:flex;gap:8px;margin-top:20px}
.tabs button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:9999px;padding:6px 16px;cursor:pointer}
.tabs button:hover{border-color:var(--line-2)}
.tabs button[aria-selected="true"]{color:#fff;background:var(--ink-soft);border-color:var(--ink-soft)}
:root[data-theme="dark"] .tabs button[aria-selected="true"]{color:var(--paper);background:var(--ink);border-color:var(--ink)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .tabs button[aria-selected="true"]{color:var(--paper);background:var(--ink);border-color:var(--ink)} }
.cov td:not(:first-child),.cov th{text-align:left;white-space:normal}
.ok{color:var(--accent-edge);font-weight:500} .part{color:var(--ink);font-weight:500;border:1px solid var(--line);border-radius:9999px;padding:0 8px}
ul.an{margin:16px 0 0;padding-left:20px;font-size:14px;color:var(--ink-soft)} ul.an li{margin:6px 0}

/* Clientes */
.lock{max-width:420px;margin:48px 0}
.lock form{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.lock input{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line-2);border-radius:6px;padding:8px 12px;flex:1;min-width:180px}
.lock input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.btn{font:inherit;font-size:14px;font-weight:500;color:#fff;background:var(--accent);border:1px solid var(--accent-edge);border-radius:9999px;padding:8px 18px;cursor:pointer}
.btn.ghost{color:var(--ink);background:transparent;border-color:var(--line)}
.msg{margin-top:10px;font-size:13px;color:var(--neg);min-height:1.2em}
#mapa{height:480px;border-radius:10px;border:1px solid var(--line);margin-top:12px;z-index:0}
.leaflet-container{font-family:var(--font);background:var(--band)}
.leaflet-tile-pane{filter:grayscale(1) contrast(.94) brightness(1.03)}
.leaflet-popup-content{font-size:13px;line-height:1.5;margin:12px 14px;min-width:220px}
.leaflet-popup-content h4{margin:0 0 2px;font-family:var(--font-d);font-weight:500;font-size:16px}
.leaflet-popup-content dl{display:grid;grid-template-columns:auto auto;gap:2px 14px;margin:8px 0 0}
.leaflet-popup-content dt{color:#78716c} .leaflet-popup-content dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.cat{display:inline-block;font-size:12px;font-weight:500;border-radius:9999px;padding:0 8px;border:1px solid var(--line);white-space:nowrap}
.cat.A{background:var(--wash);color:var(--accent-edge);border-color:transparent}
.mx{border-collapse:separate;border-spacing:6px;width:100%;table-layout:fixed}
.mx th{font-size:12px;font-weight:500;color:var(--muted);text-align:center}
.mx td{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;vertical-align:top}
.mx td b{display:block;font-family:var(--font-d);font-weight:400;font-size:24px;line-height:1.2}
.mx td small{color:var(--muted);font-size:12px}
.mx td.hi{background:var(--wash);border-color:transparent}
.dotc{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid #0c0a09;margin-right:6px;vertical-align:-1px}
table.t.cli td{font-size:13px} table.t.cli td small{color:var(--muted)}

.band{margin-top:64px;background:var(--band);border:1px solid var(--line);border-radius:16px;padding:4px 24px 24px}
.band .sec-head{padding-top:24px}
.band section.panel{margin-top:16px}
footer{margin-top:40px;font-size:12px;color:var(--ash)}
@media (max-width:560px){ .wrap{padding:16px 16px 40px} section.panel{padding:18px} .band{padding:4px 14px 18px} }
@media (prefers-reduced-motion:no-preference){ .hero h1{animation:rise .5s ease-out both} @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}} }
</style>

  <div class="band" id="actual"></div>
  </div>

  <div id="tab-hist" role="tabpanel" aria-labelledby="t-hist" hidden></div>

</div>

  if (pre.length) warns.push(`<strong>${pre.map(k=>cap(MESES[k])).join(", ")}: preliminar.</strong> Todavía no se cierra en EDO RESULTADOS; las cifras salen de las pestañas INGRESOS y GASTOS del mes (efectivo de la libreta más lo capturado a mano). Revisa que estén todas las transferencias y pagos con tarjeta; al cerrarlo en EDO RESULTADOS se usan esas cifras.`);
  ["ingresos","gastos"].forEach(sec=>ms.forEach(k=>{ const w=DATA.chk[sec][k]; if(w)
    warns.push(`<strong>Revisar en el Sheet.</strong> ${cap(MESES[k])}: las formas de pago de ${sec} suman ${money(w.parts)}, pero el total dice ${money(w.total)} (diferencia de ${money(w.total-w.parts)}); el tablero usa el total del Sheet.`); }));
  $("warn").innerHTML = warns.join(" "); $("warn").hidden = !warns.length;

  // Formas de pago
  const mix = (title, keys, obj, colors, total) => {
    const parts = keys.map((k,j)=>({k, v:pickM(obj[k],ms), c:colors[j%colors.length]})).filter(p=>p.v>0);
    return `<div><h3>${title}</h3><div class="bar">${parts.map(p=>`<span style="width:${p.v/total*100}%;background:${p.c}"></span>`).join("")}</div>
      <ul class="legend">${parts.map(p=>`<li><span><i style="background:${p.c}"></i>${nice(p.k)}</span><span>${money(p.v)} · ${pct(p.v/total)}</span></li>`).join("")}</ul></div>`;
  };
  $("mix").innerHTML = `<h2>Cómo entra y sale el dinero</h2>` +
    mix("Ingresos por forma de cobro", DATA.ingK, DATA.ingresos, ["var(--in)","var(--in-soft)","var(--muted)"], I) +
    mix("Gastos por forma de pago", DATA.gasK, DATA.gastos, ["var(--out)","var(--out-soft)","var(--ink)"], G);

  drawChart(ytd ? -1 : i);
  renderGastos(ms, ytd);
  renderClientes(ms, ytd);
  renderCaja(ms);
}

function hbars(items, total, color, fmtVal){
  const max = Math.max(...items.map(x=>x.v),1);
  return `<div class="hbars">${items.map(x=>`<div class="hb"><span class="lbl" title="${esc(x.k)}">${esc(x.k)}</span>
    <span class="trk"><span style="width:${x.v/max*100}%;background:${color}"></span></span><span class="val">${fmtVal(x)}</span></div>`).join("")}</div>`;
}

function renderGastos(ms, ytd){
  const g = DATA.detalle.gastos;
  const conceptos = Object.keys(g).map(k=>({k, v:pickM(g[k],ms), cat:categoria(k)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const total = sum(conceptos.map(x=>x.v));
  if(!total){ $("gastos").innerHTML = `<h2>En qué se gasta</h2><p class="empty">No hay detalle de gastos en las pestañas mensuales para este periodo.</p>`; return; }
  const cats = {}; conceptos.forEach(x=>cats[x.cat]=(cats[x.cat]||0)+x.v);
  const catItems = Object.entries(cats).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  const top = catItems[0];
  const edr = pickM(DATA.tG, ms);
  const porMes = ms.map(k=>({k, d:sum(Object.values(g).map(a=>a[k]||0))-(DATA.tG[k]||0)})).filter(x=>Math.abs(x.d)>1);
  const dif = Math.abs(edr-total)>1 ? `<p class="note">El detalle de las pestañas de gastos suma ${money(total)} y el estado de resultados ${money(edr)}. ` +
    `${porMes.length?`La diferencia está en ${porMes.map(x=>`${MESES[x.k]} (la pestaña GASTOS tiene ${money(Math.abs(x.d))} ${x.d>0?"más":"menos"} que EDO RESULTADOS)`).join(", ")}.`:""} Los porcentajes de esta sección usan el detalle de las pestañas.</p>` : "";
  $("gastos").innerHTML = `<h2>En qué se gasta</h2>
    <p class="lead">${esc(top.k)} se lleva ${pct(top.v/total)} del gasto ${ytd?`de enero a ${MESES[DATA.ultimo]}`:`de ${MESES[ms[0]]}`}. Porcentajes sobre ${money(total)}.</p>
    <div class="grid2">
      <div>${hbars(catItems, total, "var(--out)", x=>pct(x.v/total))}</div>
      <div class="tscroll"><table class="t"><thead><tr><th>Concepto</th><th>Monto</th><th>%</th></tr></thead><tbody>
        ${conceptos.map(x=>`<tr><td>${nice(x.k)}<br><small class="mut">${x.cat}</small></td><td>${money(x.v)}</td><td>${pct(x.v/total)}</td></tr>`).join("")}
      </tbody></table></div>
    </div>${dif}`;
}

function renderClientes(ms, ytd){
  const c = DATA.detalle.clientes;
  const all = Object.keys(c).map(k=>({k, gf:pickM(c[k].gf,ms), v:pickM(c[k].imp,ms)})).filter(x=>x.v>0||x.gf>0);
  const GF = sum(all.map(x=>x.gf)), IMP = sum(all.map(x=>x.v));
  if(!IMP){ $("clientes").innerHTML = `<h2>Mayores clientes</h2><p class="empty">No hay ventas por cliente en las pestañas mensuales para este periodo.</p>`; return; }
  const grp = k => /^VENTANILLA/.test(k) ? "VENTANILLA" : /^GARRAFON/.test(k) ? "GARRAFÓN NUEVO" : /^RUTA EFECTIVO/.test(k) ? "RUTA EFECTIVO (LIBRETA)" : k;
  const cmap = {}; all.filter(x=>CONFIG.CANALES.test(x.k)).forEach(x=>{ const g=grp(x.k); cmap[g]=cmap[g]||{k:g,gf:0,v:0}; cmap[g].gf+=x.gf; cmap[g].v+=x.v; });
  const canales = Object.values(cmap);
  const nombrados = all.filter(x=>!CONFIG.CANALES.test(x.k)).sort((a,b)=>b.gf-a.gf || b.v-a.v);
  const top = nombrados.slice(0, CONFIG.TOP_CLIENTES), resto = nombrados.slice(CONFIG.TOP_CLIENTES);
  const topGf = sum(top.map(x=>x.gf));
  const canalTxt = canales.sort((a,b)=>b.gf-a.gf).map(x=>`${nice(x.k)} ${pct(x.gf/GF)}`).join(", ");
  const fila = x => `<tr><td>${nice(x.k)}</td><td>${int(x.gf)}</td><td>${pct(x.gf/GF)}</td><td>${money(x.v)}</td><td>${pct(x.v/IMP)}</td></tr>`;
  $("clientes").innerHTML = `<h2>Mayores clientes</h2>
    <p class="lead">Los ${top.length} clientes más grandes consumieron ${int(topGf)} garrafones, ${pct(topGf/GF)} del total vendido ${ytd?`de enero a ${MESES[DATA.ultimo]}`:`en ${MESES[ms[0]]}`} (${int(GF)}).</p>
    <div class="grid2">
      <div>${hbars(top.map(x=>({k:nice(x.k),v:x.gf})), GF, "var(--in)", x=>`${int(x.v)} gf`)}</div>
      <div class="tscroll"><table class="t"><thead><tr><th>Cliente</th><th>Garrafones</th><th>% consumo</th><th>Ingreso</th><th>% ingreso</th></tr></thead><tbody>
        ${top.map(fila).join("")}
        ${resto.length?`<tr class="rest"><td>Otros ${resto.length} clientes</td><td>${int(sum(resto.map(x=>x.gf)))}</td><td>${pct(sum(resto.map(x=>x.gf))/GF)}</td><td>${money(sum(resto.map(x=>x.v)))}</td><td>${pct(sum(resto.map(x=>x.v))/IMP)}</td></tr>`:""}
        ${canales.map(x=>`<tr class="rest"><td>${nice(x.k)}</td><td>${int(x.gf)}</td><td>${pct(x.gf/GF)}</td><td>${money(x.v)}</td><td>${pct(x.v/IMP)}</td></tr>`).join("")}
      </tbody></table></div>
    </div>
    ${canalTxt?`<p class="lead" style="margin:14px 0 0">Además de los clientes con nombre: ${canalTxt} de los garrafones.</p>`:""}`;
}

function renderCaja(ms){

function drawChart(sel){
  const W=960,H=300,padL=56,padR=12,padT=16,padB=34, cw=(W-padL-padR)/12, bw=Math.min(18,cw*.28);
  const max=Math.max(...DATA.tI,...DATA.tG,1), minU=Math.min(0,...DATA.util);
  const top=Math.ceil(max/10000)*10000, bot=Math.floor(minU/10000)*10000;
  const y=v=>padT+(top-v)/(top-bot)*(H-padT-padB);
  const step=(top-bot)>60000?20000:10000;
  let g="";
  for(let v=bot;v<=top;v+=step){
    g+=`<line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?"var(--muted)":"var(--line)"}"/>`;
    g+=`<text x="${padL-8}" y="${y(v)+4}" text-anchor="end">${v===0?"0":(v/1000)+"k"}</text>`;
  }
  const pts=[];
  MESES.forEach((m,i)=>{
    const cx=padL+cw*i+cw/2, on=i===sel, act=DATA.cerrado[i], op=(sel<0||on?1:.45)*(DATA.prelim[i]?.55:1);
    let b="";
    if(act){
      b+=`<rect x="${cx-bw-1}" y="${y(DATA.tI[i])}" width="${bw}" height="${y(0)-y(DATA.tI[i])}" fill="var(--in)" opacity="${op}" rx="2"/>`;
      b+=`<rect x="${cx+1}" y="${y(DATA.tG[i])}" width="${bw}" height="${y(0)-y(DATA.tG[i])}" fill="var(--out)" opacity="${op}" rx="2"/>`;
      pts.push([cx,y(DATA.util[i]),DATA.util[i],on]);
    } else b+=`<rect x="${cx-bw-1}" y="${y(0)-3}" width="${bw*2+2}" height="3" fill="var(--line)"/>`;
    g+=`<g class="m" ${act?`tabindex="0" role="button" aria-label="Ver ${m}" data-i="${i}"`:""}>
      <rect x="${padL+cw*i+2}" y="${padT}" width="${cw-4}" height="${H-padT-padB+22}" fill="${on?"var(--in-soft)":"transparent"}" opacity="${on?.35:1}" rx="6"/>
      ${b}<text x="${cx}" y="${H-10}" text-anchor="middle" class="${on?"on":""}">${cap(m).slice(0,3)}${DATA.prelim[i]?"*":""}</text></g>`;
  });
  if(pts.length>1) g+=`<polyline points="${pts.map(p=>p[0]+","+p[1]).join(" ")}" fill="none" stroke="var(--util)" stroke-width="2"/>`;
  pts.forEach(p=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${p[3]?6:4}" fill="${p[2]<0?"var(--neg)":"var(--util)"}" stroke="var(--panel)" stroke-width="2"/>`);
  const svg=$("chart"); svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.innerHTML=g;
  svg.querySelectorAll(".m[data-i]").forEach(el=>{
    const go=()=>{ SEL=el.dataset.i; $("periodo").value=SEL; renderResultados(); };
    el.addEventListener("click",go);
    el.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } });
  });
}

// Columnas (apiladas si hay varias capas) con tooltip por mes, bandas de "sin dato" y separadores de año.
function columnas(o){
  const n=o.labels.length, W=960, H=270, pl=8, pr=8, pt=26, pb=30, cw=(W-pl-pr)/n, bw=Math.min(30,cw*.62);
  const tot=i=>sum(o.capas.map(c=>c.v[i]||0)), max=Math.max(...o.labels.map((_,i)=>tot(i)),1)*1.08;
  const y=v=>pt+(1-v/max)*(H-pt-pb), x0=i=>pl+cw*i;

    g+=`<text x="${x+w/2}" y="${pt-4}" text-anchor="middle">${esc(b.texto)}</text>`; });
  (o.anios||[]).forEach(([i,a])=>{ if(i>0) g+=`<line x1="${x0(i)}" x2="${x0(i)}" y1="${pt-18}" y2="${H-pb+4}" stroke="var(--line)" stroke-dasharray="3 3"/>`;
    g+=`<text x="${x0(i)+4}" y="${H-pb+26}" style="fill:var(--ink);font-weight:700">${a}</text>`; });
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)"/>`;
  o.labels.forEach((lb,i)=>{
    // mes parcial/incompleto: barra punteada (sin relleno), para no confundirla con otra serie en la paleta de grises
    const cx=x0(i)+cw/2, dim=(o.atenuar||[]).includes(i); let acc=0, r="";
    o.capas.forEach(c=>{ const v=c.v[i]; if(!v) return; const y0=y(acc), y1=y(acc+v), h=Math.max(1,y0-y1-(acc?2:0));
      r+= dim ? `<rect x="${cx-bw/2+.75}" y="${y1+.75}" width="${bw-1.5}" height="${Math.max(1,h-1.5)}" fill="var(--panel)" stroke="${c.fill}" stroke-width="1.5" stroke-dasharray="3 2" rx="2"/>`
              : `<rect x="${cx-bw/2}" y="${y1}" width="${bw}" height="${h}" fill="${c.fill}" rx="2"/>`; acc+=v; });
    const lbl=(o.etiquetas||[]).includes(i) && tot(i) ? `<text x="${cx}" y="${y(tot(i))-5}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${o.fmt(tot(i))}</text>` : "";
    g+=`<g><title>${esc(o.tip(i))}</title><rect x="${x0(i)}" y="${pt-18}" width="${cw}" height="${H-pt}" fill="transparent"/>${r}${lbl}
        <text x="${cx}" y="${H-pb+13}" text-anchor="middle">${lb}</text></g>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H+12}" role="img" aria-label="${esc(o.aria)}">${g}</svg>`;
}

// 2026 en vivo desde MATRIZ CONCENTRADO (el Sheet del dashboard), con los mismos criterios que la pestaña 2026:
// mes cerrado en EDO RESULTADOS → pestañas mensuales (garrafones por cliente); mes sin cerrar con notas de libreta →
// DIARIO (ruta = todas las entregas, porque la ruta en efectivo de la libreta no lleva garrafones por cliente).
function serie2026(){
  if(!DATA) return [];
  const anio=DATA.anio, hoy=new Date(), ult = hoy.getFullYear()===anio ? hoy.getMonth() : hoy.getFullYear()>anio ? 11 : -1;
  const cli=DATA.detalle.clientes||{}, out=[];
  for(let k=0;k<=ult;k++){
    const key=`${anio}-${String(k+1).padStart(2,"0")}`, dd=DATA.diario.filter(x=>x.fecha.slice(0,7)===key && !x.no_laborado);
    let vent=0, ruta=0, fuente;
    const cerradoEdr = DATA.cerrado[k] && !DATA.prelim[k];
    if(dd.length && !cerradoEdr){ vent=sum(dd.map(x=>x.ventanilla_garrafones)); ruta=sum(dd.map(x=>x.ruta_garrafones)); fuente="libreta"; }
    else { Object.entries(cli).forEach(([c,v])=>{ const g=(v.gf||[])[k]||0; if(/^RUTA EFECTIVO/.test(c)) return;
             if(/^(VENTANILLA|GARRAFON)/.test(c)) vent+=g; else ruta+=g; }); fuente="pestañas"; }
    if(vent+ruta>0) out.push({y:anio, m:k, vent, ruta, fuente, enCurso:k===hoy.getMonth()&&hoy.getFullYear()===anio});
  }
  // mes con muy pocos garrafones (menos de la mitad de la mediana) = registro incompleto
  const tots=out.filter(x=>!x.enCurso).map(x=>x.vent+x.ruta).sort((a,b)=>a-b), med=tots.length?tots[Math.floor(tots.length/2)]:0;
  out.forEach(x=>x.incompleto = !x.enCurso && x.vent+x.ruta < med/2);
  // Ventanilla que viene del documento «Analisis de Purificadora» (notas del cuaderno no capturadas en MATRIZ)
  out.forEach(x=>{ const d=HIST.ventanilla2026Doc[x.m]; if(d!=null && x.y===2026){ x.vent=d; x.ventDoc=true; }
                   x.ventOk = !x.enCurso && (x.ventDoc || !x.incompleto); });
  return out;
}

/* ===== Clientes: ABC-XYZ, márgenes y mapa (datos protegidos con clave) =====
   Garrafones y ventas por mes: pestañas mensuales de MATRIZ (DATA.detalle.clientes, 2026 de febrero al último mes cerrado).
   Domicilio, precio, días de visita y ubicación: pestaña CLIENTES + GEO CLIENTES, vía ?vista=clientes&clave=… */
let CLI=null, MAPA=null;
const money2 = n => new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const CAT_COLOR = {A:"#3ba6f1", B:"#78716c", C:"#e7e5e4"};   // hex: Leaflet pinta SVG y no resuelve var()

function lockHTML(msg){
  return `<div class="lock"><div class="sec-head" style="padding-top:24px"><div class="per">Clientes · acceso restringido</div></div>
    <h1 style="font-family:var(--font-d);font-weight:400;font-size:32px;letter-spacing:-.025em;line-height:1.25;margin:8px 0 0">Direcciones, precios y márgenes por cliente.</h1>
    <p class="mut" style="margin:10px 0 0">Esta pestaña tiene datos sensibles; escribe la clave de Clientes.</p>
    <form id="cli-form" autocomplete="off"><input id="cli-clave" type="password" placeholder="Clave de Clientes" aria-label="Clave de Clientes" required>
      <button class="btn" type="submit">Entrar</button></form><div class="msg" id="cli-msg" role="alert">${msg?esc(msg):""}</div></div>`;
}
function pedirClave(msg){
  $("tab-cli").innerHTML = lockHTML(msg);
  $("cli-form").addEventListener("submit", e=>{ e.preventDefault(); cargarClientes($("cli-clave").value.trim()); });
}
async function cargarClientes(clave){
  if(!clave) return pedirClave();
  const m=$("cli-msg"); if(m) m.textContent="Cargando…";
  try{
    const r=await fetch(`${CONFIG.SOURCE_URL}?key=${encodeURIComponent(CONFIG.KEY)}&vista=clientes&clave=${encodeURIComponent(clave)}&t=${Date.now()}`);
    const j=await r.json();
    if(!j.ok){ try{ sessionStorage.removeItem("cliClave"); }catch(e){} return pedirClave(j.error||"No se pudo leer Clientes"); }
    try{ sessionStorage.setItem("cliClave", clave); }catch(e){}
    CLI=j; renderClientes();
  }catch(e){ pedirClave("No se pudo conectar con el Sheet."); }
}

// Clasificación ABC: A hasta el 80% acumulado (incluye al que cruza), B hasta 95%, C el resto.
function abc(items, key){
  const tot=sum(items.map(x=>x[key])), ord=items.slice().sort((a,b)=>b[key]-a[key]); let acc=0;
  ord.forEach(x=>{ const antes=acc/tot; acc+=x[key]; x["abc_"+key] = !x[key] ? "C" : antes<.80 ? "A" : antes<.95 ? "B" : "C"; });
}
const xyz = cv => cv==null ? "Z" : cv<.25 ? "X" : cv<.5 ? "Y" : "Z";

function calcClientes(){
  const anio=DATA.anio, cli=DATA.detalle.clientes||{}, K=CLI.costos;
  const ult=DATA.cerrado.lastIndexOf(true), ks=[]; for(let k=1;k<=ult;k++) ks.push(k);   // feb → último mes cerrado
  const agua = K.litrosGarrafon*K.pipaPrecio/K.pipaLitros/(1-(K.merma||0));
  const insumos = K.insumos ? sum(Object.values(K.insumos)) : 0, costoVar = agua+insumos;
  // Gasolina REAL: promedio mensual de los gastos de gasolina (pestañas GASTOS) en el mismo periodo
  const gasC = Object.keys(DATA.detalle.gastos||{}).filter(k=>/GASOLINA/.test(k));
  const gasMes = ks.length ? sum(ks.map(k=>sum(gasC.map(c=>DATA.detalle.gastos[c][k]||0))))/ks.length : 0;
  const lista = CLI.clientes.filter(c=>!CONFIG.CANALES.test(c.nombre)).map(c=>{
    const d=cli[c.nombre]||{gf:[],imp:[]}, gf=ks.map(k=>d.gf[k]||0), imp=ks.map(k=>d.imp[k]||0);
    const gfT=sum(gf), impT=sum(imp), n=ks.length||1, gfM=gfT/n, impM=impT/n;
    const sd=Math.sqrt(sum(gf.map(x=>(x-gfM)**2))/n), cv=gfM>0?sd/gfM:null;
    const precio = c.precio || (gfT?impT/gfT:null);
    const factura = /FACTURA|^SI$/.test(c.factura||"");
    const precioNeto = precio!=null ? (factura ? precio/(1+(K.iva||0)) : precio) : null;
    const visitas = c.dias.length*K.semanasMes;
    const costoVisita = c.km!=null ? 2*c.km/K.kmPorLitro*K.precioGasolina : null;          // referencia: viaje exclusivo
    const kmMes = c.km!=null ? 2*c.km*visitas : null;                                         // peso para repartir la gasolina real
    return {...c, gf, imp, gfT, impT, gfM, impM, gfUlt:d.gf[ult]||0, impUlt:d.imp[ult]||0, cv, xyz:xyz(cv), precio,
            factura, precioNeto, visitas, costoVisita, kmMes, mapa: c.lat!=null&&c.lng!=null};
  });
  // Costo real de ruta: la gasolina del mes se reparte según los km que cada cliente agrega (visitas × ida y vuelta)
  const kmTot = sum(lista.filter(x=>x.gfT>0||x.impT>0).map(x=>x.kmMes||0));
  lista.forEach(x=>{
    x.costoRutaMes = x.kmMes!=null && kmTot ? gasMes*x.kmMes/kmTot : (x.kmMes===0?0:null);
    x.rutaGf = x.costoRutaMes!=null && x.gfM>0 ? x.costoRutaMes/x.gfM : null;
    x.margenGf = x.precioNeto!=null ? x.precioNeto-costoVar-(x.rutaGf||0) : null;
    x.margenPct = x.margenGf!=null && x.precioNeto ? x.margenGf/x.precioNeto : null;
    x.utilMes = x.margenGf!=null ? x.margenGf*x.gfM : null;
  });
  const activos = lista.filter(x=>x.impT>0||x.gfT>0);
  abc(activos,"impT"); abc(activos,"gfT");
  lista.forEach(x=>{ if(!activos.includes(x)){ x.abc_impT="—"; x.abc_gfT="—"; x.xyz="—"; } x.cat = x.abc_impT==="—" ? "—" : x.abc_impT+x.xyz; });
  return {lista, activos, ks, ult, agua, insumos, costoVar, gasMes, kmTot, K};
}

function popupHTML(x){
  const f=(v,fn)=>v==null?"—":fn(v);
  return `<h4>${esc(nice(x.nombre))}</h4><span class="cat ${x.abc_impT}">${x.cat}</span> <small style="color:#78716c">ventas ${x.abc_impT} · garrafones ${x.abc_gfT} · variabilidad ${x.xyz}</small>
    <dl><dt>Garrafones / mes</dt><dd>${int(x.gfM)} (último ${int(x.gfUlt)})</dd>
    <dt>Garrafones 2026</dt><dd>${int(x.gfT)}</dd>
    <dt>Ventas / mes</dt><dd>${money(x.impM)} (último ${money(x.impUlt)})</dd>
    <dt>Ventas 2026</dt><dd>${money(x.impT)}</dd>
    <dt>Precio por garrafón</dt><dd>${f(x.precio,money2)}${x.factura?` (${money2(x.precioNeto)} sin IVA)`:""}</dd>
    <dt>Margen por garrafón</dt><dd>${f(x.margenGf,v=>money2(v)+" · "+pct(x.margenPct))}</dd>
    <dt>Distancia (por calle)</dt><dd>${f(x.km,v=>v.toLocaleString("es-MX",{maximumFractionDigits:1})+" km · "+x.min+" min")}</dd>
    <dt>Visitas / mes</dt><dd>${x.dias.length?`${int(x.visitas)} (${x.dias.map(d=>d.slice(0,2).toLowerCase()).join(", ")})`:"sin días de ruta"}</dd>
    <dt>Gasolina asignada / mes</dt><dd>${f(x.costoRutaMes,money)}${x.rutaGf!=null?` · ${money2(x.rutaGf)}/gf`:""}</dd>
    <dt>Viaje exclusivo (ref.)</dt><dd>${f(x.costoVisita,money)} por visita</dd>
    <dt>Utilidad / mes</dt><dd>${f(x.utilMes,money)}</dd></dl>`;
}

function dibujarMapa(R){
  if(!window.L){ setTimeout(()=>dibujarMapa(R),300); return; }
  if(MAPA){ MAPA.remove(); MAPA=null; }
  const P=CLI.purificadora, pts=R.lista.filter(x=>x.mapa);
  MAPA=L.map("mapa",{scrollWheelZoom:false});
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(MAPA);
  const b=[]; const maxGf=Math.max(1,...pts.map(x=>x.gfM));
  if(P.lat!=null){ b.push([P.lat,P.lng]);
    L.marker([P.lat,P.lng],{icon:L.divIcon({className:"",html:'<div style="width:18px;height:18px;border-radius:5px;background:#0c0a09;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>',iconSize:[18,18]}),zIndexOffset:1000})
      .addTo(MAPA).bindPopup(`<h4>${esc(P.nombre)}</h4><small style="color:#78716c">Punto de partida de la ruta${P.fuente?` · ubicación: ${esc(P.fuente.toLowerCase())}`:""}</small>`); }
  pts.sort((a,b)=>b.gfM-a.gfM).forEach(x=>{ b.push([x.lat,x.lng]);
    const r=6+10*Math.sqrt(x.gfM/maxGf), m=L.circleMarker([x.lat,x.lng],{radius:r, color:"#0c0a09", weight:1, fillColor:CAT_COLOR[x.abc_impT]||"#e7e5e4", fillOpacity:.9}).addTo(MAPA);
    m.bindPopup(popupHTML(x)); m.bindTooltip(nice(x.nombre),{direction:"top",offset:[0,-r]});
    if(P.lat!=null){ let ln=null;
      m.on("popupopen",()=>{ ln=L.polyline([[P.lat,P.lng],[x.lat,x.lng]],{color:"#0c0a09",weight:1.5,dashArray:"4 4",opacity:.7}).addTo(MAPA); });
      m.on("popupclose",()=>{ if(ln) MAPA.removeLayer(ln); }); } });
  if(b.length) MAPA.fitBounds(b,{padding:[30,30],maxZoom:15}); else MAPA.setView([20.674,-103.387],13);
}

function renderClientes(){
  if(!CLI) return;
  if(!DATA){ $("tab-cli").dataset.pend="1"; $("tab-cli").innerHTML=`<p class="mut" style="margin-top:40px">Cargando datos…</p>`; return; }
  delete $("tab-cli").dataset.pend;
  const R=calcClientes(), A=R.activos, ult=R.ult, mesUlt=MESES[ult], per=`febrero a ${mesUlt} ${DATA.anio}`;
  const impTot=sum(A.map(x=>x.impT)), gfTot=sum(A.map(x=>x.gfT));
  const enMapa=R.lista.filter(x=>x.mapa), revision=R.lista.filter(x=>!x.mapa);
  const aV=A.filter(x=>x.abc_impT==="A"), aShare=sum(aV.map(x=>x.impT))/impTot;

  const fila=x=>`<tr><td><span class="dotc" style="background:${CAT_COLOR[x.abc_impT]||"#fff"}"></span>${esc(nice(x.nombre))}<br><small>${esc(x.medio.toLowerCase()||"—")}${x.dias.length?` · ${x.dias.length} días/sem`:""}</small></td>

    <td>${x.precio!=null?money2(x.precio):"—"}<br><small>${x.factura?"factura · "+money2(x.precioNeto)+" s/IVA":""}</small></td>
    <td class="${x.margenGf==null?"":cls(x.margenGf)}">${x.margenGf!=null?money2(x.margenGf):"—"}<br><small>${x.margenPct!=null?pct(x.margenPct):""}</small></td>
    <td>${x.km!=null?x.km.toLocaleString("es-MX",{maximumFractionDigits:1})+" km":"—"}<br><small>${x.min!=null?x.min+" min":""}</small></td>
    <td>${x.costoRutaMes!=null?money(x.costoRutaMes):"—"}<br><small>${x.rutaGf!=null?money2(x.rutaGf)+"/gf":""}</small></td>
    <td class="${x.utilMes==null?"":cls(x.utilMes)}">${x.utilMes!=null?money(x.utilMes):"—"}</td></tr>`;

  $("tab-cli").innerHTML = `
    <div class="sec-head"><div class="per">Clientes · <b>${per}</b> · ${A.length} con compras</div>
      <button class="btn ghost" id="cli-salir" type="button">Cerrar sesión</button></div>
    <div class="hero"><h1>${aV.length} clientes A concentran <span class="amt pos">${pct(aShare)}</span> de las ventas.</h1>

    </section>

    <div class="grid2" style="margin-top:24px">
      <section class="panel" style="margin-top:0"><h2>Matriz ABC-XYZ</h2>
        <p class="lead">Clientes y % de ventas en cada cuadro. ABC por ventas: A = 80% de las ventas, B = siguiente 15%, C = último 5%. XYZ por variación mensual de garrafones: X &lt; 25%, Y 25–50%, Z &gt; 50%.</p>
        <table class="mx"><thead><tr><th></th>${xs.map(z=>`<th>${z} · ${z==="X"?"estable":z==="Y"?"variable":"irregular"}</th>`).join("")}</tr></thead><tbody>
          ${cats.map(a=>`<tr><th>${a}</th>${xs.map(z=>{ const c=celda(a,z); return `<td class="${a==="A"&&c.n?"hi":""}" title="${a}${z}: ${desc[a+z]}"><b>${c.n}</b><small>${pct(c.imp/impTot)} de ventas</small></td>`; }).join("")}</tr>`).join("")}

        <div class="kv">
          <div><span>Agua</span><b>${money2(R.agua)}</b><small>por garrafón de ${K.litrosGarrafon} L</small></div>
          <div><span>Sello y tapa</span><b>${money2(R.insumos)}</b><small>por garrafón</small></div>
          <div><span>Gasolina real</span><b>${money(R.gasMes)}</b><small>al mes, promedio ${per}</small></div>
          <div><span>Utilidad / mes</span><b>${money(utilTot)}</b><small>clientes con precio (antes de sueldos y renta)</small></div>
        </div>
        ${peor.length?`<ul class="an"><li>Menor margen: ${peor.map(x=>`${esc(nice(x.nombre))} (${pct(x.margenPct)})`).join(", ")}.</li></ul>`:""}
        <p class="note"><strong>Cómo se reparte la gasolina:</strong> el gasto real de gasolina del mes (pestañas GASTOS) se divide entre los clientes según los km que agrega cada uno: visitas al mes (días de ruta en CLIENTES × ${K.semanasMes}) × ida y vuelta por calle. Clientes sin ubicación o sin días de ruta no reciben gasolina. En la ventana de cada cliente se ve también el costo de un viaje exclusivo como referencia (${K.kmPorLitro} km/L y ${money(K.precioGasolina)}/L, supuestos).</p>
      </section>
    </div>

    <section class="panel"><h2>Clientes</h2><p class="lead">Ordenados por ventas ${per}. "Últ." = ${mesUlt}.</p>
      <div class="tscroll"><table class="t cli"><thead><tr><th>Cliente</th><th>Categoría</th><th>Gf / mes</th><th>Gf 2026</th><th>Ventas / mes</th><th>Ventas 2026</th><th>Precio</th><th>Margen / gf</th><th>Distancia</th><th>Ruta / mes</th><th>Utilidad / mes</th></tr></thead><tbody>
        ${A.slice().sort((a,b)=>b.impT-a.impT).map(fila).join("")}
        <tr style="font-weight:600"><td>Total</td><td></td><td>${int(gfTot/R.ks.length)}</td><td>${int(gfTot)}</td><td>${money(impTot/R.ks.length)}</td><td>${money(impTot)}</td><td></td><td></td><td></td><td></td><td>${money(utilTot)}</td></tr>
      </tbody></table></div>
    </section>

    <section class="panel"><h2>En revisión · fuera del mapa</h2>
      <p class="lead">${revision.length} clientes sin domicilio o que no se pudieron ubicar. Cuando se complete su domicilio en CLIENTES aparecen solos en el mapa.</p>
      ${revision.length?`<div class="tscroll"><table class="t"><thead><tr><th>Cliente</th><th>Motivo</th><th>Ventas 2026</th></tr></thead><tbody>
        ${revision.sort((a,b)=>b.impT-a.impT).map(x=>`<tr><td>${esc(nice(x.nombre))}</td><td style="text-align:left">${x.geo==="SIN DOMICILIO"?"Sin domicilio":x.geo==="NO ENCONTRADO"?"Domicilio no encontrado en el mapa":x.geo==="PENDIENTE"?"Ubicación pendiente (se calcula en la próxima carga)":esc(x.geo)}</td><td>${money(x.impT)}</td></tr>`).join("")}
      </tbody></table></div>`:`<p class="empty">Todos los clientes están en el mapa.</p>`}
      ${R.lista.filter(x=>!x.gfT&&!x.impT).length?`<p class="lead" style="margin:12px 0 0">Sin compras en el periodo (no se clasifican): ${R.lista.filter(x=>!x.gfT&&!x.impT).map(x=>esc(nice(x.nombre))).join(", ")}.</p>`:""}
    </section>`;
  $("cli-salir").addEventListener("click",()=>{ CLI=null; try{ sessionStorage.removeItem("cliClave"); }catch(e){} if(MAPA){ MAPA.remove(); MAPA=null; } pedirClave(); });
  dibujarMapa(R);
}

function abrirClientes(){
  if(CLI){ renderClientes(); return; }
  let k=null; try{ k=sessionStorage.getItem("cliClave"); }catch(e){}
  if(k) cargarClientes(k); else pedirClave();
}

/* ===== Pestañas ===== */
const TABS = {"2026":["t-2026","tab-2026",""], hist:["t-hist","tab-hist","#historico"], esp:["t-esp","tab-esp","#espera"], cli:["t-cli","tab-cli","#clientes"]};
function showTab(t){
  Object.entries(TABS).forEach(([k,[b,p]])=>{ const on=k===t; $(p).hidden=!on; $(b).setAttribute("aria-selected",on); $(b).tabIndex=on?0:-1; });
  try{ history.replaceState(null,"",TABS[t][2]||location.pathname+location.search); }catch(e){}
  if(t==="cli") abrirClientes();
  if(t==="cli" && MAPA) setTimeout(()=>MAPA.invalidateSize(),50);
}
Object.entries(TABS).forEach(([k,[b]])=>$(b).addEventListener("click",()=>showTab(k)));
document.querySelector(".tabs").addEventListener("keydown",e=>{
  if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft") return;
  const ks=Object.keys(TABS), i=ks.findIndex(k=>$(TABS[k][0]).getAttribute("aria-selected")==="true");
  const n=ks[(i+(e.key==="ArrowRight"?1:ks.length-1))%ks.length]; showTab(n); $(TABS[n][0]).focus(); });
document.querySelectorAll("nav a").forEach(a=>a.addEventListener("click",()=>showTab("2026")));
renderHistorico();
if(location.hash==="#historico") showTab("hist");
if(location.hash==="#clientes") showTab("cli");
if(location.hash==="#espera") showTab("esp");

/* ===== Carga ===== */
function setStatus(){
  const when=new Date(DATA.actualizado);
  $("status").innerHTML = `<span class="dot ${SOURCE}"></span><span>${SOURCE==="live"
    ? `En vivo · leído ${when.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})}`
    : `Datos de respaldo del ${when.toLocaleDateString("es-MX",{day:"numeric",month:"long"})}`}</span>`;
  $("foot").textContent = SOURCE==="live"
    ? `Fuente: Google Sheets. Resultados: EDO RESULTADOS y pestañas mensuales. Mes actual: pestañas DIARIO y MOVIMIENTOS. Se actualiza cada ${CONFIG.REFRESH_MIN} minutos.`
    : (CONFIG.SOURCE_URL ? "No se pudo leer el Sheet; se muestran los datos de respaldo. Revisa la URL y la clave del Apps Script." : "Conecta el Sheet pegando la URL del Apps Script en CONFIG.SOURCE_URL.");
}

async function load(){
  let d=SNAPSHOT; SOURCE="snap";
  if(CONFIG.SOURCE_URL){
    try{ const r=await fetch(`${CONFIG.SOURCE_URL}?key=${encodeURIComponent(CONFIG.KEY)}&t=${Date.now()}`); const j=await r.json();
      if(j && !j.error && j.ingresos){ d=j; SOURCE="live"; } }catch(e){ console.warn("Sheet no disponible:",e); }
  }
  DATA=norm(d);
  if(DATA.empresa) $("brand").innerHTML = `${nice(DATA.empresa)}<small>Resultados del negocio ${DATA.anio}</small>`;
  buildSelect(); renderResultados(); renderInventario(); renderActual(); renderHistorico(); renderEspera(); if(CLI && $("tab-cli").dataset.pend) renderClientes(); setStatus();
}
$("periodo").addEventListener("change",e=>{ SEL=e.target.value; renderResultados(); });
load();
if(CONFIG.SOURCE_URL) setInterval(load, CONFIG.REFRESH_MIN*60*1000);
</script>
</body>
</html>
